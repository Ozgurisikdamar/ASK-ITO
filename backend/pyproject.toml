[project]
name = "ask-ito-backend"
version = "0.1.0"
description = "Ask ITO - agentic RAG search engine backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<0.29",
    "PyYAML>=6.0,<7",
]

# Heavy retrieval / ML dependencies are introduced in later milestones (M3+):
#   sentence-transformers, bm25s, ragas, datasets, numpy, scikit-learn
# They are kept out of the core install so the skeleton stays light to run.
[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
