[project]
name = "ask-ito-backend"
version = "0.1.0"
description = "Ask ITO - agentic RAG search engine backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<0.29",
    "PyYAML>=6.0,<7",
]

# Retrieval / embedding dependencies (M3). Install CPU torch from the PyTorch
# CPU index to avoid pulling CUDA wheels:
#   pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
#   pip install -e ".[index]"
[project.optional-dependencies]
index = [
    "sentence-transformers>=3.0,<4",
    "bm25s>=0.2,<0.3",
    "PyStemmer>=2.2,<3",
    "numpy>=1.26,<3",
]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
