# Production-style stack: nginx-served frontend, backend without --reload,
# local Ollama tuned for a single CPU user. For hot reload during development:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: askito
      POSTGRES_PASSWORD: askito
      POSTGRES_DB: askito
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askito -d askito"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://askito:askito@db:5432/askito
      # LLM_LOCAL_ONLY allows loopback only; the compose `ollama` service is the one
      # explicitly trusted private-network host (bridge network, never public).
      LLM_ALLOWED_HOSTS: ollama
      # Optional local cache (L2 for embedding / retrieval / answer / agent tool
      # caches). If it is down the backend logs a warning and uses its in-process
      # and PostgreSQL caches. Never holds model KV tensors.
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      REDIS_ALLOWED_HOSTS: redis
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      # source + data/ (snapshot, BM25 index) live on the host
      - ./backend:/app
      - model_cache:/root/.cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 75
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

  # Local cache only: no host port, no persistence, bounded memory with LRU eviction.
  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped

  # Local LLM (default provider). Pull the model once: ./askito model
  ollama:
    image: ollama/ollama:0.40.12
    environment:
      OLLAMA_KEEP_ALIVE: 24h          # keep the model in RAM between searches
      OLLAMA_NUM_PARALLEL: "1"        # one request at a time: full CPU per request
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      # KV cache precision (not the model weights): f16 = no extra compression.
      # q8_0 halves KV memory; use it only if f16 causes real memory pressure.
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-f16}
      OLLAMA_CONTEXT_LENGTH: "4096"   # prompts are short; a small context is faster
      OLLAMA_LOAD_TIMEOUT: 30m        # first load from a cold disk can exceed the 5 min default
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  db_data:
  model_cache:
  ollama_data:
